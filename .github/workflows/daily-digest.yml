name: Daily Upkeep digest

on:
  schedule:
    # Runs a few times a day (GitHub's timing is approximate); the script de-duplicates
    # so each newly due task only ever notifies once.
    - cron: '30 20 * * *'
    - cron: '30 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now regardless of the time (for testing)'
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/daily-digest.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          UPKEEP_UID: ${{ secrets.UPKEEP_UID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_SEND: ${{ inputs.force }}
